[project]
name = "gba-bridge-finance-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.20",
]

[tool.vercel]
entrypoint = "api.index:app"
